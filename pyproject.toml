[project]
name = "tlh-engine"
version = "0.1.0"
description = "Tax-Loss Harvesting Engine: lot-level tax accounting, wash-sale compliance, factor risk model, constrained harvest optimizer, embedded Claude co-pilot, PySide6 desktop GUI."
requires-python = ">=3.12"
dependencies = [
  "norgatedata>=1.0.74",
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "cvxpy>=1.5",
  "clarabel",
  "osqp",
  "duckdb>=1.0",
  "pyarrow>=15",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "PySide6>=6.7",
  "plotly>=5.20",
  "xlsxwriter>=3.2",
  "anthropic>=0.60",
  "fredapi>=0.5",
  "PyYAML>=6.0",
  "orjson>=3.9",
  "yfinance>=0.2.50",
  "markdown-it-py>=3.0",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.5", "pytest-qt"]

[project.scripts]
tlh = "tlh.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tlh*"]
