# State income-tax treatment of capital gains, all 50 states + DC.
#
# APPROXIMATE 2026 figures compiled for planning; verify against each state's published tables before relying on a
# number for a filing. Rates are fractions (0.05 = 5%). Brackets are single-filer thresholds where the state is
# progressive (MFJ thresholds are usually higher); flat states carry one bracket.
#
# treatment:
#   ordinary     capital gains taxed as ordinary income at the state's rates
#   none         no state tax on capital gains
#   exclusion    a percentage of (long-term) gains is excluded from state taxable income (exclusion_pct)
#   flat_cg      long-term gains taxed at a flat capital-gains rate (lt_rate) instead of ordinary rates
#   excise       standalone capital-gains excise above a threshold (Washington)
# lt_addon / st_addon: extra rate applied to gains above addon_threshold (surtaxes on investment income).
# local_note: municipal / county income taxes that stack on top (not modelled).
year: 2026
states:
